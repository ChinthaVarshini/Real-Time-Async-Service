<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Task Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; color: #00d4ff; margin-bottom: 10px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .card h2 { color: #00d4ff; margin-bottom: 20px; font-size: 1.3rem; }
        .status {
            padding: 12px 20px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
        }
        .status.connected { background: #065f46; color: #fff; }
        .status.disconnected { background: #7f1d1d; color: #fff; }
        .input {
            width: 100%;
            background: #1a1a2e;
            border: 2px solid #333;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 14px;
        }
        .textarea { min-height: 100px; resize: vertical; }
        .button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px 8px 8px 0;
            font-weight: bold;
            font-size: 14px;
        }
        .button:hover:not(:disabled) { background: #3730a3; }
        .button:disabled { background: #666; cursor: not-allowed; }
        .button.success { background: #059669; }
        .button.danger { background: #dc2626; }
        .log {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }
        .log-entry { margin-bottom: 4px; padding: 2px 0; }
        .log-entry.success { color: #10b981; }
        .log-entry.error { color: #ef4444; }
        .stat { display: inline-block; margin: 10px; text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Async Task Dashboard</h1>
            <p>Real-time File Upload and Email System</p>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Connection Status</h2>
                <div id="status" class="status disconnected">Disconnected</div>
                <input type="text" id="token" class="input" placeholder="Enter JWT token" />
                <button id="connect" class="button" type="button">Connect</button>
                <button id="disconnect" class="button danger" type="button" disabled>Disconnect</button>
                <br/>
                <div id="log" class="log"></div>
            </div>

            <div class="card">
                <h2>Task Statistics</h2>
                <div class="stat">
                    <div class="stat-value" id="totalTasks">0</div>
                    <div>Total Tasks</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="processingTasks">0</div>
                    <div>Processing</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="completedTasks">0</div>
                    <div>Completed</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="failedTasks">0</div>
                    <div>Failed</div>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>File Upload</h2>
                <div id="fileDrop" class="input" style="text-align:center;cursor:pointer;padding:30px;">Click to upload or drag files here</div>
                <input type="file" id="fileInput" multiple style="display: none;" />
                <div id="fileList"></div>
                <button id="uploadFiles" class="button success" disabled>Upload Files</button>
            </div>

            <div class="card">
                <h2>Email Task</h2>
                <textarea id="emailRecipients" class="input" placeholder="Recipients (comma or newline separated)"></textarea>
                <input type="text" id="emailSubject" class="input" placeholder="Email subject" />
                <textarea id="emailBody" class="input" placeholder="Email message body"></textarea>
                <button id="sendEmail" class="button success" disabled>Send Email</button>
            </div>
        </div>
    </div>

    <script>
        var ws = null;
        var connected = false;
        var selectedFiles = [];

        var statusEl = document.getElementById("status");
        var tokenEl = document.getElementById("token");
        var connectBtn = document.getElementById("connect");
        var disconnectBtn = document.getElementById("disconnect");
        var fileDropEl = document.getElementById("fileDrop");
        var fileInputEl = document.getElementById("fileInput");
        var fileListEl = document.getElementById("fileList");
        var uploadBtn = document.getElementById("uploadFiles");
        var emailRecipientsEl = document.getElementById("emailRecipients");
        var emailSubjectEl = document.getElementById("emailSubject");
        var emailBodyEl = document.getElementById("emailBody");
        var sendEmailBtn = document.getElementById("sendEmail");
        var logEl = document.getElementById("log");
        var totalTasksEl = document.getElementById("totalTasks");
        var processingTasksEl = document.getElementById("processingTasks");
        var completedTasksEl = document.getElementById("completedTasks");
        var failedTasksEl = document.getElementById("failedTasks");

        function log(msg) {
            var entry = document.createElement("div");
            entry.className = "log-entry success";
            entry.textContent = msg;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateUI(isConnected) {
            connected = isConnected;
            if (isConnected) {
                statusEl.textContent = "Connected";
                statusEl.className = "status connected";
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusEl.textContent = "Disconnected";
                statusEl.className = "status disconnected";
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connect() {
            var token = tokenEl.value.trim();
            if (!token) {
                log("Error: Please enter a token");
                return;
            }
            log("Connecting...");
            connectBtn.disabled = true;
            var url = "ws://localhost:4004/ws?token=" + token;
            ws = new WebSocket(url);
            
            ws.onopen = function() {
                log("Connected successfully");
                updateUI(true);
            };
            
            ws.onmessage = function(event) {
                log("Message: " + event.data);
            };
            
            ws.onclose = function() {
                log("Connection closed");
                updateUI(false);
                connectBtn.disabled = false;
            };
            
            ws.onerror = function(error) {
                log("Error: " + error);
                updateUI(false);
                connectBtn.disabled = false;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            updateUI(false);
        }

        // Event Listeners
        connectBtn.addEventListener("click", function() {
            console.log("Connect clicked");
            connect();
        });

        disconnectBtn.addEventListener("click", function() {
            disconnect();
        });

        fileDropEl.addEventListener("click", function() {
            fileInputEl.click();
        });

        fileInputEl.addEventListener("change", function(e) {
            selectedFiles = Array.from(e.target.files);
            log("Files selected: " + selectedFiles.length);
        });

        uploadBtn.addEventListener("click", function() {
            if (ws && selectedFiles.length > 0) {
                log("Uploading " + selectedFiles.length + " files...");
            }
        });

        sendEmailBtn.addEventListener("click", function() {
            log("Sending email...");
        });

        updateUI(false);
        log("Dashboard ready");
    </script>
</body>
</html>
