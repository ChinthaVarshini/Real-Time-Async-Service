services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "4000:4000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-secret-key
      - PORT=4000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/gateway:/app
      - ./node_modules:/app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_CONCURRENCY=5
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=varshinichintha0@gmail.com
      - SMTP_PASS=depqlabobaaptjpg
      - SMTP_FROM=varshinichintha0@gmail.com
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app
      - ./node_modules:/app/node_modules
    deploy:
      replicas: 2

volumes:
  redis_data: